name: Checkout for verify
description: Check out the base of a pull request and merge the pull request on top.
inputs:
  head:
    description: Pull request head commit. Defaults to the head of the pull request that triggered the run.
    default: ''
  base:
    description: Base commit to merge onto. Defaults to the current tip of the pull request's base branch.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.base || github.event.pull_request.base.ref }}
        fetch-depth: 0
    - shell: bash
      env:
        HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
      run: |
        git fetch origin "${HEAD_SHA}"
        if ! git -c user.name=verify -c user.email=verify@hearthctl.invalid merge --no-ff --no-edit FETCH_HEAD; then
          echo "::error::needs rebase: the pull request does not merge into the current base branch"
          exit 1
        fi
